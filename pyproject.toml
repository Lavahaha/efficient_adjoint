[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eaopt"
version = "0.1.0"
description = "Efficient adjoint-based shape optimization for microwave components (paper reproduction)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "scikit-fmm>=2025.6.23; python_version < '3.14'",
]

[tool.setuptools]
py-modules = ["adjoint_levelset"]
packages = ["eaopt", "eaopt.solver", "eaopt.geometry", "eaopt.adjoint", "eaopt.optimize"]
