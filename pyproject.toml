[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eaopt"
version = "0.1.0"
description = "Efficient adjoint-based shape optimization for microwave components (paper reproduction)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# CST 官方 Python 库（cst.interface / cst.results）不在 PyPI 上，由 CST
# 安装包自带（cst-studio-suite-link），装法见 docs/server_runbook.md 第 0 节。
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["eaopt", "eaopt.solver", "eaopt.geometry", "eaopt.adjoint", "eaopt.optimize"]
