# Continuous patch antenna optimization. CST-side geometry/material parameters
# are defined in eaopt/solver/cst_setup.py and cst_model_antenna.py.
name: antenna
description: Continuous patch antenna, single-port S11 minimization

objective:
  type: transmission
  from_port: 1
  to_port: 1

# Paper l_w1=l_p1=40 mm; centered at the origin. The fixed 5x5 mm feed pad
# sits just outside the left edge and touches the initial 20x20 mm patch.
design_region:
  box:
    x: [-20.0, 20.0]
    y: [-20.0, 20.0]
  grid_step_mm: 0.2
  field_margin_mm: 2.0

initial_metal:
  # l_w1/2 by l_p1/2, aligned to the design-region left edge and y center.
  - vertices: [[-20.0, -10.0], [0.0, -10.0], [0.0, 10.0], [-20.0, 10.0]]

# Fixed feed pad outside the level-set design region.
fixed_region:
  - vertices: [[-25.0, -2.5], [-20.0, -2.5], [-20.0, 2.5], [-25.0, 2.5]]

constraints:
  min_gap_mm: 0.0
  min_feature_mm: 0.6
  allowed_region:
    x: [-20.0, 20.0]
    y: [-20.0, 20.0]
  taper_edges: none
  require_connected: false

sampling:
  field_z_mm: 0.0
  intersection_offset_mm: 0.4
  sample_side: outside

optimizer:
  pseudo_time_step: 1.0e-8
  cfl: 0.5
  velocity_sign: 1.0
  max_iterations: 30
level_set:
  extension_band_mm: 1.0
output:
  dir: results/antenna
