# ======================================================================
# 探索算例：divider 双频优化（S21@4/6 GHz 均达到 -3 dB）
#
# 本文件只描述**优化问题**（设计区、初始金属、采样、优化器……）。
# CST 侧的一切（模板布局、5 GHz 频点、Rogers3003 基板、35 um 金属、
# 3 个端口的端口面、场导出步长、求解设置）在
# eaopt/solver/cst_setup.py 的 DIVIDER + eaopt/solver/cst_model_divider.py
# —— 改 CST 模型改那两处。
#
# 论文参数（供对照）：5 GHz；Rogers3003 (30 mil, eps_r=3.0, tan_d=0.001)；
#   所有线宽 w=2 mm；设计区 = λg/2 长输入段 + 两根 λg/4 长分路臂（Y 形）；
#   目标 max |S21|：初始两端各 ≈ -3.49 dB -> 迭代 40 时 -0.72 / -11.84 dB
#   （功率比 9:1 只是同一条演化路径上的中间轮次，不是分别跑 4 次）；
#   50 次迭代 ≈ 3 h 24 min。
#   **已知偏差**：臂长取文字的 λg/4 = 9.61（论文图上量得 14.2，与标注矛盾）；
#   板子 50×22 比论文的 65×30 紧凑。只看趋势与量级，不追求逐点吻合。
# ======================================================================

name: divider_multifreq
description: divider 双频探索（S21@4/6 GHz，两个频点均达到 -3 dB）

objective:
  type: transmission
  from_port: 1     # 正向仿真激励端口（工程 fwd）= 输入
  to_port: 2       # 反向仿真激励端口（工程 bwd）= FoM 观测端口（上输出）
  frequencies_ghz: [4.0, 6.0]
  target_db: -3.0
  beta_per_db: 1.0

design_region:
  # 设计区 = 论文 Fig.9 的红虚线框 = **可动金属的活动范围**：
  # "the design region consists of a λ/2 long input waveguide and two λ/4 long
  #  splitter waveguides" —— 框内那条 Y 形金属整体可动。
  box:
    x: [6.0, 33.7]      # 左界 = 输入馈线末端；右界 = 两臂端中心线
                        # （= 6.0 + λg/2 19.2 + 臂水平投影 8.5）
    y: [-9.0, 9.0]      # 上下界 = 输出线偏移 4.5 的 2 倍（论文图上比例 2.1）
  grid_step_mm: 0.1     # **统一网格**：水准集 φ / 边界采样点都用它
                        # （277 × 180 格，正好整除；论文点距经验 0.1~0.5 mm）
                        # 注意：CST 场导出**不是**这个步长（见 cst_setup.DIVIDER
                        # 的 export_step_mm=0.2 / export_step_z_mm=0.1）——
                        # 导出体积按步长立方增长，0.1 mm 下每份要 200 MB 以上。
  field_margin_mm: 1.0  # 场导出裁剪范围 = 设计区 ± 1 mm

initial_metal:
  # Y 形三块：输入段 + 上臂 + 下臂（并集；分叉处重叠，LevelSet2D 自动连成一体）。
  # **必须与 eaopt/solver/cst_model_divider.py::initial_metal_polygons() 一致**
  # 锁定）。分叉臂末端最后 1.0 mm 做梯形过渡，确保其两个顶点分别与
  # 固定输出微带线在 x=33.7 的两个顶点重合；连接处无三角缺口，也不外扩重叠。
  - vertices: [
      [6.0000, -1.0000], [25.2000, -1.0000],
      [25.2000, 1.0000], [6.0000, 1.0000]
    ]
  - vertices: [
      [24.7321, 0.8838], [32.7000, 5.1021], [33.7000, 5.5000],
      [33.7000, 3.5000], [32.7000, 2.8391], [25.6679, -0.8838]
    ]
  - vertices: [
      [25.6679, 0.8838], [32.7000, -2.8391], [33.7000, -3.5000],
      [33.7000, -5.5000], [32.7000, -5.1021], [24.7321, -0.8838]
    ]

fixed_region:
  # 固定馈线终止于设计区边界，与活动区金属共边连接，不向设计区内重叠。
  # 输出端口沿用论文中的直线走线，位于板右边缘。
  # **必须与 cst_model_divider.py::fixed_metal_polygons() 一致**（测试锁定）。
  - vertices: [
      [0.0000, -1.0000], [6.0000, -1.0000],
      [6.0000, 1.0000], [0.0000, 1.0000]
    ]
  - vertices: [
      [33.7000, 3.5000], [50.0000, 3.5000],
      [50.0000, 5.5000], [33.7000, 5.5000]
    ]
  - vertices: [
      [33.7000, -5.5000], [50.0000, -5.5000],
      [50.0000, -3.5000], [33.7000, -3.5000]
    ]

constraints:
  # **必须为 0**：apply_min_gap 在固定金属周围铺禁区带；非 0 间隙会侵入设计区
  # 边界并把可动金属与固定馈线之间的共边连接削断（CST 仍可能照常出 S 参数）。
  # 这个算例框内本来就只有一块金属
  # （Y 形），没有"两块金属靠太近"的问题；真要阻止分裂由连通性约束负责
  # （见 constraints.require_connected）。
  min_gap_mm: 0.0
  # taper 只作用在 x 两端：可动金属在那里到达设计区边界并接触固定馈线。
  # 上下边是设计区自身的边界（臂可以朝那里长），不 taper。
  taper_edges: x
  # 论文那条几何约束"the microstrip lines are always connected"（两输出必须
  # 同相）的**硬保证**：每个 HJ 子步后检查可动金属是否仍是一块、且贴着初始的
  # 三个锚点（左界输入段 + 右界两个臂端）；被掐断就按最短路径桥接并冻结桥接
  # 节点。锚点从初始 φ 自动推导，不在这里写。关掉它 = 允许优化把结构拆散，
  # 而 CST 照样出 S 参数（结果是另一个器件的）。
  require_connected: true

sampling:
  field_z_mm: 0
  intersection_offset_mm: 0.3
  sample_side: inside

optimizer:
  pseudo_time_step: 1.0e-8
  cfl: 0.5
  velocity_sign: 1.0
  max_iterations: 50
level_set:
  extension_band_mm: 0.5
output:
  dir: E:/zouyi/efficient_adjoint/results/divider_multifreq
