# ======================================================================
# 算例：高定向性定向耦合器（复现论文 III-A）—— 优化配置
#
# 本文件只描述**优化问题**（设计区、初始金属、采样、优化器……）。
# CST 侧的一切（模板布局、5 GHz 频点、Rogers4350B 基板、35 um 金属、
# 4 个端口的端口面、场导出步长、求解设置）在
# eaopt/solver/cst_setup.py 的 COUPLER —— 改 CST 模型改那里。
#
# 论文参数（供对照）：5 GHz；Rogers4350B (30 mil, eps_r=3.66, tan_d=0.0037)；
#   初始 w=1.6 mm, d=12 mm, g=1 mm；金属 35 um；
#   目标 max |S31|：初始 -17.9 dB -> 优化后约 -10 dB，
#   定向性 4.6 -> 17.1 dB，插入损耗 < 1 dB，约 20 次迭代。
# ======================================================================

name: coupler
description: 高定向性定向耦合器（论文 III-A）

objective:
  type: transmission
  from_port: 1     # 正向仿真激励端口（工程 fwd）
  to_port: 3       # 反向仿真激励端口（工程 bwd）= FoM 观测端口

design_region:
  # 设计区 = 论文 Fig.5 的红虚线框 = **可动金属的活动范围**（论文只有一个域：
  # "the coupling region within the red dashed box is the design region"），
  # 因此不再单列 constraints.allowed_region。
  box:
    x: [0.0, 12.0]      # 耦合段长度 d（= 两腿内边缘之间）= 红框左右界
    y: [-2.6, 0.9]      # = 红框上下界（按论文图实测 mm 值）
                        # 上界 0.9 = 直通线下边缘 1.0 − 最小间距 0.1：论文约束
                        #   "耦合臂上边缘不得超过上方直通线，且最小间距 0.1 mm"
                        #   写成盒子就是这条边界（速度掩膜另留 0.2 mm 余量）
                        # 下界 -2.6 = 内圆角最低点 -2.0 再留 0.6 mm 向下生长余量
                        # 注意：CST 模板的腿内边缘必须与此 x 范围一致，
                        # 由 tests/test_cst_model.py::test_config_design_box_agrees_with_template 锁定
  grid_step_mm: 0.1   # **统一网格**：水准集 φ / 采样点 / CST 场导出步长都用它
                      # （论文点距经验 0.1~0.5 mm）。设计区 x 0/12、y -2.6/0.9
                      # 都落在这张格子线上（导出网格原点 x-5.6/y-6.9，实测对齐）。
                      # 改这里 = 同时改 CST 导出步长：0.2→0.1 导出点数 ×4（约 52 MB/个）
  field_margin_mm: 1.0

initial_metal:
  # 耦合臂横段 + 两端内侧四分之一圆过渡（论文 Fig.5：等宽条带圆角拐弯，
  # 中心线半径 1.2，内缘 R=0.4、外缘 R=2.0 同心）。切点落在设计区边角：
  # 左 (0,-2.0)->(0.4,-1.6)，右 (12,-2.0)->(11.6,-1.6)。
  # **必须与 eaopt/solver/cst_model.py::_arm_design_polygon() 一致**
  # （tests/test_cst_model.py::test_config_initial_metal_matches_template 锁定）。
  # 直通线不在列：它在设计区之外（y>=1.0 > 上界 0.9），不属于水准集域，
  # 作为固定金属见 fixed_region。
  - vertices: [
      [0.0000, -2.0000], [0.0136, -1.8965], [0.0536, -1.8000],
      [0.1172, -1.7172], [0.2000, -1.6536], [0.2965, -1.6136],
      [0.4000, -1.6000], [11.6000, -1.6000], [11.7035, -1.6136],
      [11.8000, -1.6536], [11.8828, -1.7172], [11.9464, -1.8000],
      [11.9864, -1.8965], [12.0000, -2.0000], [12.0000, 0.0000],
      [0.0000, 0.0000]
    ]

fixed_region:
  # 直通线整体固定（论文：耦合臂上边缘不得超过上方直通线）。它整个在设计区
  # 之外，约束作用经速度掩膜的"固定金属邻域"兑现：距直通线 <
  # max(min_gap, 2dx) = 0.2 mm 的节点速度置零 → 臂顶最多长到 y = 0.8，
  # 与直通线留 0.2 mm ≥ 论文要求的 0.1 mm。设计区上界 0.9 本身已是硬边界，
  # min_gap 投影那条 0.1 mm 禁区带在域内为空（不额外起作用）。
  - vertices: [[-1.0, 1.0], [13.0, 1.0], [13.0, 2.6], [-1.0, 2.6]]

constraints:
  min_gap_mm: 0.1       # 论文：最小间距 0.1 mm
  # 当前关闭 x taper，检查它对耦合臂端部速度截断的影响；若端部几何出现
  # 不连续，再按结果恢复或缩窄 taper。上下边不 taper，以允许臂顶长进耦合间隙。
  taper_edges: none

sampling:
  # 交点方案：边界点 = marching 在网格线上的交点（两端节点 φ 线性插值，
  # 亚格点；交给 CST 的几何与做灵敏度分析的采样点是同一份离散）；
  # 场值按坐标用加权最小二乘从 CST 导出网格取（导出网格原点由 CST 包围盒
  # 定，**不要求与 φ 网格对齐**）；速度回写 = 最近节点 + 四邻居反距离平方。
  field_z_mm: 0.0         # 金属底面；若导出网格没有精确 z=0，代码优先选最近的 z>=0 面
  # --- intersection 方案参数 ---
  # 采样位置照论文 p.501：边缘上取场奇异，要**贴着边缘、在金属内侧**采样。
  # δz = 0.3 mm（论文只给符号不给数值；本算例场导出 0.1 mm → 3 格）。
  # 不做薄结构钳制：特征薄于 2δz 时采样点会落到金属对侧（已知代价）。
  intersection_offset_mm: 0.3
  wls_radius_cells: 2.0   # WLS 邻域半径（单位 = 场导出网格步长）；单侧（金属侧）
                          # 拟合，半径要够大才凑得满模板
  wls_order: 1            # 1=局部线性（默认）| 2=局部二次
  scatter_max_cells: 1.0  # 速度回写作用半径（φ 网格格数）；回写点在**未偏移的**
                          # 交点上，与 δz 无关（否则 skfmm 延拓没种子，见 pipeline）
  sample_side: inside     # 金属内侧（论文）；WLS 节点掩膜随之取 φ<0 一侧
optimizer:
  pseudo_time_step: 1.0e-8  # 初始伪时间步；FoM 不改善时回溯减半
  step_cells: 8.0      # 仅旧 pipeline 使用；adjoint-levelset runner 使用 pseudo_time_step
  step_min_cells: 1.0
  step_decay_factor: 0.5
  step_plateau_patience: 2
  step_relative_threshold: 1.0e-3
                       # normalize=none 时语义变为：|δp| 的 step_ref_quantile
                       # 分位点每轮位移 = 0.8 mm，其余点按自身 δp 比例
  cfl: 0.5             # 保持稳定子步长；每步最多 0.05 mm（子步数由规划器定）
  velocity_sign: 1.0   # 局部 CST 有限差分验证支持 +1；完整迭代仍需监控 FoM
  # 2026-10-18 试验：去掉"一点独享 |V|=1、其余按 max|δp| 比例缩"的归一化。
  # 各点按自身 δp 大小比例移动（论文式 (25) 直接用 δp 作位移的精神）。
  # 注意：max 归一化路径仍可回退（normalize: max）。
  normalize: none
  step_ref_quantile: 0.9   # 参考分位（normalize=none 时生效）
  max_iterations: 30
  fom_tolerance: 1.0e-4
  convergence_window: 5

level_set:
  reinit_every: 1      # 0.8 mm 大步长后每轮重初始化，控制距离函数质量
  extension_band_mm: 1.0  # 大于单轮最大位移 0.8 mm，避免速度窄带截断更新
  extension_method: auto   # auto（有 scikit-fmm 就用，缺库打印告警后回退 PDE）|
                           # skfmm（缺库直接报错，正式跑用这个更明确）| pde（对照）

output:
  dir: E:/zouyi/efficient_adjoint/results/coupler
